name: Create release from manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          version="$(jq -er '.version | strings | select(length > 0)' manifest.json)"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing_release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.setOutput("exists", "false");
            }

      - name: Create release
        if: steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
